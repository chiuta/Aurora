    tutBox:"Tempi uguali con ritenzioni. Calma la mente e affina la concentrazione; usata dagli atleti e sotto pressione.",
    tutCalm:"Una lunga espirazione dopo una ritenzione. Accompagna il corpo verso il riposo e il sonno.",
    tutTip:"Se senti capogiri o fiato corto, torna alla respirazione normale. È una pratica di rilassamento, non un consiglio medico.", bResonant:"Risonante", tutResonant:"Il respiro «risonante» della pratica Gateway (Istituto Monroe): inspira profondamente immaginando di portare l'energia verso l'alto, nella testa; trattieni e lasciala turbinare lì; poi espira lentamente dalla bocca, come per spegnere una candela, spingendo l'energia consumata giù e fuori dalle piante dei piedi. Tradizionalmente ripetuto in fasi che riempiono il corpo dalla testa ai piedi. La pratica avanzata allunga la ritenzione verso un lento conteggio fino a dieci.", rbSteps:"Tradizionalmente il respiro si ripete in sei fasi, ognuna riempie una parte più bassa del corpo: 1) la testa, 2) il petto e le braccia, 3) l'addome, 4) il bacino, 5) le cosce e le ginocchia, 6) le gambe e i piedi — come riempire un vaso di energia fresca dall'alto verso il basso.", gwTitle:"Pratiche Gateway", gwIntro:"Alcune tecniche di visualizzazione e rilassamento dal Gateway Process dell'Istituto Monroe (scritto nel 1977, desecretato dalla CIA nel 2003). Sono pratiche soggettive di esplorazione della coscienza e di rilassamento — non medicina. Leggine una, poi chiudi gli occhi e provala a modo tuo.", gwNote:"Le schede contrassegnate da un avviso sono tecniche dell'originale che affermano effetti sulla salute o paranormali. Non hanno alcun fondamento scientifico e sono qui solo per mantenere completo il documento. Non sono un consiglio medico — per dolore reale o malattia, rivolgiti sempre a un medico.", gwPrep:"Prepara", gwFocusT:"Focus 10 — rilassamento profondo", gwFocusD:"Lo stato centrale del Gateway: corpo profondamente rilassato, mente sveglia e limpida. Lasciati scendere e conta lentamente da uno a dieci, ogni numero ti porta un po' più in profondità. Per tornare, conta da dieci a uno. Si abbina bene al respiro lento.", gwRebalT:"Palloncino di energia (REBAL)", gwRebalD:"Con il respiro risonante, immagina una sfera luminosa di energia che si forma tutt'intorno a te — un campo calmo e protettivo, con te al centro, sempre più rotondo e leggero a ogni respiro. Si abbina al respiro risonante e alla sfera 3D.", gwEbtT:"Barra di luce (EBT)", gwEbtD:"Immagina un piccolo punto di luce ed espandilo in una barra luminosa di luce bianca. Esercitati a ravvivarla e a lasciarla pulsare — lentamente, poi più veloce. Un modo semplice per raccogliere e concentrare l'attenzione all'interno.", gwBoxT:"Scatola del deposito", gwBoxD:"Prima di iniziare, immagina una scatola accanto a te. Metti dentro preoccupazioni, compiti e distrazioni e chiudi il coperchio — ti aspetteranno lì. Questo libera la mente per sistemarti più facilmente.", gwColorT:"Strumenti di energia con i colori", gwColorD:"«Strumenti» quotidiani del documento: immagina verde calmante per rilasciare la tensione emotiva; rosso acceso per uno scatto di prontezza prima dello sforzo; viola curativo inviato a una zona dolente o tesa per 'equilibrarla'; e ripetere un numero per attenuare il dolore. (Affermato nel 1977 — nessuna prova che funzioni e non sostituisce le cure mediche.)", gwObeT:"Fuori dal corpo e percezione a distanza", gwObeD:"Il documento descrive anche il fluttuare fuori dal corpo fisico (Free Movement) e il percepire persone o eventi lontani tramite la barra di energia (Remote Viewing). (Presentati come esperienza soggettiva — non ci sono prove scientifiche di uscire letteralmente dal corpo o di percepire a distanza.)", gwWarn:"Nessuna prova", gwAffirmT:"Intenzione preparatoria", gwAffirmD:"Il Gateway inizia con un'intenzione pronunciata (la Prima e la Seconda Affermazione del documento). Con parole tue: riconosci di essere più del tuo corpo fisico; dichiara di voler esplorare, imparare e crescere in modi benefici e costruttivi; e chiedi di restare aperto solo a ciò che aiuta, e protetto da tutto il resto. Dillo lentamente — le parole contano solo con il sentire dietro.", gwF12T:"Focus 12 e orientamento spaziale", gwF12D:"Quando il Focus 10 è stabile, il documento descrive uno stato più profondo ed energizzato che chiama Focus 12: conta dolcemente 'undici', poi 'dodici', e lascia crescere un senso di consapevolezza espansa. Un esercizio complementare: immagina un orologio con la tua consapevolezza al centro e dirigi l'attenzione verso 3, 6, 9 e 12 a turno, poi ruota l'orologio per esplorare in ogni direzione. Per tornare, conta lentamente da dodici fino a uno.", gwPatT:"Cambiare gli schemi", gwPatD:"Nello stato più profondo del Focus 12, immagina con chiarezza un cambiamento che desideri nella tua vita — costruisci la scena con cura nella mente, poi lasciala andare verso la tua consapevolezza più ampia e lasciala posare. Proposto come esercizio di concentrazione e intenzione; non ci sono prove che cambi gli eventi esterni da solo.", gwDailyT:"Sonno ristoratore e memoria", gwDailyD:"Due semplici strumenti quotidiani del documento. Per dormire: sdraiati comodamente, respira profondamente cinque volte, poi conta lentamente da uno a venti e lasciati scivolare nel sonno. Per ricordare qualcosa: chiudi gli occhi e appoggia leggermente i polpastrelli di una mano al centro della fronte, chiedendo con calma alla tua memoria.", gwMapT:"Mappe del corpo (LBM ed EBM)", gwMapD:"Una scansione dettagliata del corpo dal documento. Immagina un contorno luminoso del tuo corpo e colora i suoi sistemi a turno — blu per i nervi, rosso per la circolazione, arancione per muscoli e ossa, giallo per gli organi, bianco per l'insieme. Cerca le zone spente o tremolanti e 'ricaricale' con luce viola immaginata. Un contorno più sottile dietro rappresenta il corpo emotivo. (Una visualizzazione del 1977 — nessuna prova di effetti sul corpo e non sostituisce le cure mediche.)", gwCloseT:"Chiusura e ritorno", gwCloseD:"Il documento insiste su un ritorno delicato. Per tornare da uno stato più profondo, conta lentamente verso la consapevolezza ordinaria — da dieci (o dodici) a uno — e fai qualche respiro tranquillo. Per un ritorno rapido in qualsiasi momento, muovi semplicemente una parte del corpo: un dito, un dito del piede o la lingua. Infine, tira fuori dalla scatola immaginata le preoccupazioni su cui puoi davvero agire e annota ciò che hai notato.", gwSet:"Pronto — respiro impostato su «{b}»{v}. Chiudi questa finestra e premi «Riproduci» per iniziare, seguendo l'anello attorno al mandala.", gwSetViz:", e la vista è passata alla sfera 3D", mute:"Silenzia", unmute:"Riattiva audio", shareL:"Copia link", linkCopied:"Link copiato", bell:"Campana a intervalli", bellS:"Un suono lieve durante la sessione", bellEvery:"Intervallo", minAbbr:"min", breathsL:"respiri", resume:"Riprendi", scVol:"Volume su / giù", resetL:"Ripristina predefiniti", resetSure:"Tocca di nuovo per confermare", jDown:"Percorso discendente", jDownS:"Dalla corona alla radice, per il radicamento",

    aboutSci:"As frequências, os chakras e os sons semente vêm de tradições espirituais e do yoga, não da ciência. Não há provas fiáveis de que certas frequências curem órgãos ou de que os batimentos binaurais alterem de forma fiável os estados cerebrais. Considere a Aurora um instrumento contemplativo, não médico.",
    tutIntro:"Siga o anel à volta da mandala: alarga-se quando inspira, mantém-se cheio enquanto retém e estreita-se quando expira. A palavra e a contagem decrescente dizem-lhe o que fazer. Respire suavemente pelo nariz, em direção à barriga — sem nunca forçar.",
    tutCoh:"Equilibra o sistema nervoso — cerca de seis respirações lentas por minuto. Boa para se acalmar a qualquer momento.",
    tutBox:"Tempos iguais com retenções. Acalma a mente e afia a concentração; usada por atletas e sob pressão.",
    tutCalm:"Uma expiração longa após reter o ar. Aproxima o corpo do descanso e do sono.",
    tutTip:"Se sentir tonturas ou falta de ar, volte à respiração normal. É uma prática de relaxamento, não um conselho médico.", bResonant:"Ressonante", tutResonant:"A respiração «ressonante» da prática Gateway (Instituto Monroe): inspire fundo, imaginando que leva energia para cima, até à cabeça; segure e deixe-a girar aí; depois expire devagar pela boca, como se apagasse uma vela, enviando a energia gasta para baixo e para fora pelas plantas dos pés. Tradicionalmente repetida em etapas que enchem o corpo da cabeça aos pés. A prática avançada prolonga a retenção até uma contagem lenta de dez.", rbSteps:"Tradicionalmente a respiração repete-se em seis etapas, cada uma enchendo uma parte mais baixa do corpo: 1) a cabeça, 2) o peito e os braços, 3) o abdómen, 4) a pélvis, 5) as coxas e os joelhos, 6) as pernas e os pés — como encher um frasco com energia fresca de cima para baixo.", gwTitle:"Práticas Gateway", gwIntro:"Algumas técnicas de visualização e relaxamento do Gateway Process do Instituto Monroe (escrito em 1977, desclassificado pela CIA em 2003). São práticas subjetivas de exploração da consciência e de relaxamento — não medicina. Lê uma e depois fecha os olhos e experimenta à tua maneira.", gwNote:"Os cartões assinalados com um aviso são técnicas do original que alegam efeitos de saúde ou paranormais. Não têm apoio científico e estão aqui apenas para manter o documento completo. Não são conselho médico — para dor real ou doença, consulta sempre um médico.", gwPrep:"Preparar", gwFocusT:"Focus 10 — relaxamento profundo", gwFocusD:"O estado central do Gateway: corpo profundamente relaxado, mente desperta e clara. Deixa-te descer e conta devagar de um a dez, cada número leva-te um pouco mais fundo. Para voltar, conta de dez a um. Combina bem com a respiração lenta.", gwRebalT:"Balão de energia (REBAL)", gwRebalD:"Com a respiração ressonante, imagina uma esfera luminosa de energia a formar-se à tua volta — um campo calmo e protetor, contigo no centro, cada vez mais redondo e leve a cada respiração. Combina com a respiração ressonante e a esfera 3D.", gwEbtT:"Barra de luz (EBT)", gwEbtD:"Imagina um pequeno ponto de luz e expande-o numa barra brilhante de luz branca. Pratica avivá-la e deixá-la pulsar — devagar, depois mais rápido. Uma forma simples de reunir e focar a atenção para dentro.", gwBoxT:"Caixa de depósito", gwBoxD:"Antes de começar, imagina uma caixa ao teu lado. Coloca dentro as preocupações, tarefas e distrações e fecha a tampa — vão esperar por ti ali. Isto limpa a mente para te acomodares mais facilmente.", gwColorT:"Ferramentas de energia com cores", gwColorD:"«Ferramentas» diárias do documento: imagina verde calmante para libertar tensão emocional; vermelho vivo para um impulso de atenção antes do esforço; violeta curativo enviado a uma zona dorida ou tensa para a 'equilibrar'; e repetir um número para atenuar a dor. (Afirmado em 1977 — sem evidência de que funcione e não substitui os cuidados médicos.)", gwObeT:"Fora do corpo e perceção à distância", gwObeD:"O documento também descreve flutuar para fora do corpo físico (Free Movement) e sentir pessoas ou eventos distantes através da barra de energia (Remote Viewing). (Apresentados como experiência subjetiva — não há evidência científica de sair literalmente do corpo nem de perceção à distância.)", gwWarn:"Sem evidência", gwAffirmT:"Intenção preparatória", gwAffirmD:"O Gateway começa com uma intenção falada (a Primeira e a Segunda Afirmação do documento). Com as tuas palavras: reconhece que és mais do que o teu corpo físico; declara que desejas explorar, aprender e crescer de formas benéficas e construtivas; e pede para permanecer aberto só ao que ajuda, e protegido de tudo o resto. Di-lo devagar — as palavras só contam com o sentir por trás.", gwF12T:"Focus 12 e orientação espacial", gwF12D:"Quando o Focus 10 está estável, o documento descreve um estado mais profundo e energizado a que chama Focus 12: conta suavemente 'onze', depois 'doze', e deixa crescer uma sensação de consciência expandida. Um exercício acompanhante: imagina um relógio com a tua consciência no centro e dirige a atenção para o 3, 6, 9 e 12 à vez, depois roda o relógio para explorar em todas as direções. Para voltar, conta devagar de doze até um.", gwPatT:"Mudança de padrões", gwPatD:"No estado mais profundo do Focus 12, imagina claramente uma mudança que desejas na tua vida — constrói a cena com cuidado na mente, depois liberta-a para a tua consciência mais ampla e deixa-a assentar. Apresentado como exercício de foco e intenção; não há evidência de que mude os acontecimentos exteriores por si só.", gwDailyT:"Sono reparador e memória", gwDailyD:"Duas ferramentas simples do documento. Para dormir: deita-te confortavelmente, respira fundo cinco vezes, depois conta devagar de um a vinte e deixa-te adormecer. Para recordar algo: fecha os olhos e pousa levemente as pontas dos dedos de uma mão no centro da testa enquanto pedes com calma à tua memória.", gwMapT:"Mapas do corpo (LBM e EBM)", gwMapD:"Uma varredura corporal detalhada do documento. Imagina um contorno luminoso do teu corpo e colore os seus sistemas à vez — azul para os nervos, vermelho para a circulação, laranja para músculo e osso, amarelo para os órgãos, branco para o conjunto. Procura zonas apagadas ou trémulas e 'recarrega-as' com luz violeta imaginada. Um contorno mais fino atrás representa o corpo emocional. (Uma visualização de 1977 — sem evidência de efeito no corpo e não substitui os cuidados médicos.)", gwCloseT:"Encerramento e regresso", gwCloseD:"O documento insiste num regresso suave. Para voltar de um estado mais profundo, conta devagar até à consciência comum — de dez (ou doze) a um — e faz algumas respirações calmas. Para um regresso rápido a qualquer momento, mexe simplesmente uma parte do corpo: um dedo, um dedo do pé ou a língua. Por fim, tira da caixa imaginada as preocupações sobre as quais podes mesmo agir e anota o que notaste.", gwSet:"Pronto — respiração definida para «{b}»{v}. Fecha esta janela e carrega em «Reproduzir» para começar, seguindo o anel à volta da mandala.", gwSetViz:", e a vista mudou para a esfera 3D", mute:"Silenciar", unmute:"Ativar som", shareL:"Copiar ligação", linkCopied:"Ligação copiada", bell:"Sino de intervalo", bellS:"Um som suave durante a sessão", bellEvery:"Intervalo", minAbbr:"min", breathsL:"respirações", resume:"Retomar", scVol:"Aumentar / baixar volume", resetL:"Repor predefinições", resetSure:"Toca outra vez para confirmar", jDown:"Percurso descendente", jDownS:"Da coroa à raiz, para enraizamento",
    aboutP1:"Aurora é um santuário sonoro: escolha um chakra, deixe o seu tom envolvê-lo e, se quiser, siga o guia de respiração ou uma viagem automática por todos os centros de energia.",

    tutTip:"Si sents mareig o falta d'aire, torna a la respiració normal. És una pràctica de relaxació, no un consell mèdic.", bResonant:"Ressonant", tutResonant:"La respiració «ressonant» de la pràctica Gateway (Institut Monroe): inspira profundament, imaginant que puges energia fins al cap; retén-la i deixa-la giravoltar allà; després expira a poc a poc per la boca, com si apaguessis una espelma, enviant l'energia gastada avall i cap enfora per les plantes dels peus. Tradicionalment es repeteix en etapes que omplen el cos del cap als peus. La pràctica avançada allarga la retenció cap a un compte lent fins a deu.", rbSteps:"Tradicionalment la respiració es repeteix en sis etapes, cadascuna omplint una part més baixa del cos: 1) el cap, 2) el pit i els braços, 3) l'abdomen, 4) la pelvis, 5) les cuixes i els genolls, 6) les cames i els peus — com omplir un pot amb energia fresca de dalt a baix.", gwTitle:"Pràctiques Gateway", gwIntro:"Algunes tècniques de visualització i relaxació del Gateway Process de l'Institut Monroe (escrit el 1977, desclassificat per la CIA el 2003). Són pràctiques subjectives d'exploració de la consciència i de relaxació — no pas medicina. Llegeix-ne una i després tanca els ulls i prova-la a la teva manera.", gwNote:"Les targetes marcades amb un avís són tècniques de l'original que afirmen efectes de salut o paranormals. No tenen cap suport científic i són aquí només per mantenir el document complet. No són consell mèdic — per a dolor real o malaltia, ves sempre al metge.", gwPrep:"Prepara", gwFocusT:"Focus 10 — relaxació profunda", gwFocusD:"L'estat central del Gateway: cos profundament relaxat, ment desperta i clara. Deixa't baixar i compta a poc a poc d'un a deu, cada número et porta una mica més endins. Per tornar, compta de deu a u. Va bé amb la respiració lenta.", gwRebalT:"Globus d'energia (REBAL)", gwRebalD:"Amb la respiració ressonant, imagina una esfera lluminosa d'energia formant-se al teu voltant — un camp tranquil i protector, amb tu al centre, cada cop més rodó i lleuger a cada respiració. Va amb la respiració ressonant i l'esfera 3D.", gwEbtT:"Barra de llum (EBT)", gwEbtD:"Imagina un petit punt de llum i expandeix-lo en una barra brillant de llum blanca. Practica il·luminar-la i deixar-la polsar — a poc a poc, després més ràpid. Una manera senzilla de recollir i enfocar l'atenció cap endins.", gwBoxT:"Caixa de dipòsit", gwBoxD:"Abans de començar, imagina una caixa al teu costat. Posa-hi les preocupacions, tasques i distraccions i tanca la tapa — t'esperaran allà. Això aclareix la ment perquè t'assentis més fàcilment.", gwColorT:"Eines d'energia amb colors", gwColorD:"«Eines» diàries del document: imagina verd calmant per alliberar tensió emocional; vermell intens per a un impuls d'alerta abans de l'esforç; violeta guaridor enviat a una zona adolorida o tensa per 'equilibrar-la'; i repetir un número per esmorteir el dolor. (Afirmat el 1977 — sense evidència que funcioni i no substitueix l'atenció mèdica.)", gwObeT:"Fora del cos i percepció a distància", gwObeD:"El document també descriu surar fora del cos físic (Free Movement) i percebre persones o esdeveniments llunyans mitjançant la barra d'energia (Remote Viewing). (Presentats com a experiència subjectiva — no hi ha evidència científica de sortir literalment del cos ni de percebre a distància.)", gwWarn:"Sense evidència", gwAffirmT:"Intenció preparatòria", gwAffirmD:"El Gateway comença amb una intenció dita (la Primera i la Segona Afirmació del document). Amb les teves paraules: reconeix que ets més que el teu cos físic; declara que vols explorar, aprendre i créixer de maneres beneficioses i constructives; i demana quedar obert només al que ajuda, i protegit de tota la resta. Digues-ho a poc a poc — les paraules només compten amb el sentiment al darrere.", gwF12T:"Focus 12 i orientació espacial", gwF12D:"Quan el Focus 10 és estable, el document descriu un estat més profund i energitzat que anomena Focus 12: compta suaument 'onze', després 'dotze', i deixa créixer una sensació de consciència expandida. Un exercici acompanyant: imagina un rellotge amb la teva consciència al centre i dirigeix l'atenció cap al 3, 6, 9 i 12 per torns, després gira el rellotge per explorar en totes direccions. Per tornar, compta a poc a poc de dotze fins a u.", gwPatT:"Canvi de patrons", gwPatD:"En l'estat més profund del Focus 12, imagina amb claredat un canvi que vulguis a la teva vida — construeix l'escena amb cura a la ment, després allibera-la cap a la teva consciència més àmplia i deixa-la reposar. Ofert com a exercici de concentració i intenció; no hi ha evidència que canviï els fets externs per si mateix.", gwDailyT:"Son reparador i memòria", gwDailyD:"Dues eines senzilles del document. Per dormir: estira't còmodament, respira fondo cinc vegades, després compta a poc a poc d'un a vint i deixa't endur per la son. Per recordar alguna cosa: tanca els ulls i recolza suaument els dits d'una mà al centre del front mentre demanes amb calma a la teva memòria.", gwMapT:"Mapes del cos (LBM i EBM)", gwMapD:"Un escaneig corporal detallat del document. Imagina un contorn lluminós del teu cos i acoloreix-ne els sistemes per torns — blau per als nervis, vermell per a la circulació, taronja per a múscul i os, groc per als òrgans, blanc per al conjunt. Busca zones apagades o parpellejants i 'recarrega-les' amb llum violeta imaginada. Un contorn més fi al darrere representa el cos emocional. (Una visualització de 1977 — sense evidència d'efecte al cos i no substitueix l'atenció mèdica.)", gwCloseT:"Tancament i retorn", gwCloseD:"El document insisteix en un retorn suau. Per tornar d'un estat més profund, compta a poc a poc cap a la consciència ordinària — de deu (o dotze) a u — i fes unes quantes respiracions tranquil·les. Per a un retorn ràpid en qualsevol moment, mou simplement una part del cos: un dit, un dit del peu o la llengua. Finalment, treu de la caixa imaginada les preocupacions sobre les quals sí que pots actuar, i anota el que hagis notat.", gwSet:"A punt — respiració ajustada a «{b}»{v}. Tanca aquesta finestra i prem «Reprodueix» per començar, seguint l'anell al voltant del mandala.", gwSetViz:", i la vista ha canviat a l'esfera 3D", mute:"Silencia", unmute:"Activa el so", shareL:"Copia l'enllaç", linkCopied:"Enllaç copiat", bell:"Campana d'interval", bellS:"Un so suau durant la sessió", bellEvery:"Interval", minAbbr:"min", breathsL:"respiracions", resume:"Reprèn", scVol:"Apuja / abaixa el volum", resetL:"Restableix els valors", resetSure:"Torna a tocar per confirmar", jDown:"Recorregut descendent", jDownS:"De la corona a l'arrel, per arrelar",
    aboutP1:"Aurora és un santuari sonor: tria un chakra, deixa que el seu to t'envolti i, si vols, segueix la guia de respiració o un viatge automàtic per tots els centres energètics.",

    aboutNote:"Eina contemplativa inspirada en la pràctica dels sons curatius (p. ex. Centrul AmaneSer, amaneser.ro). Les freqüències i els chakres pertanyen a tradicions espirituals, no a la medicina — per a la relaxació i la meditació, no com a tractament.", toneVolL:"Volum del to", gongVolL:"Volum del gong", savePresetL:"Desa", presetsL:"Patrons desats", obTitle:"Benvingut", ob1:"Tria un chakra de la columna.", ob2:"Prem Comença per a un to suau i respiració guiada.", ob3:"Fes servir auriculars per als batecs binaurals. Tot funciona sense connexió — res no surt del teu dispositiu.", storageWarn:"La configuració no es desarà en aquest mode del navegador.", bDeep:"Profund (4-8)", bSlow:"Lent (6-6)", exportL:"Exporta la configuració", importL:"Importa la configuració", noteL:"Solfeggio", senseL:"Sentit", aboutFreq:"Les freqüències segueixen la tradició Solfeggio — p. ex. 396 Hz per alliberar, 528 Hz per a l'equilibri, 639 Hz per a les relacions, 963 Hz per a la connexió. Són associacions tradicionals de la pràctica del so, no efectes mèdics mesurats.", expand:"desplega", vizMandala:"Mandala", vizSphere:"Esfera 3D"

  mx.beginPath(); mx.arc(0,0,baseR*1.9*pulse,0,6.2832); mx.fillStyle=halo; mx.fill();

  const R=baseR*pulse*breathScale;
  if(c.star){
    drawStar(0, R*1.12, 5, col, rot, 0.85);
    drawStar(0, R*0.70, 5, col, -rot*0.7+Math.PI/5, 0.5);
    mx.beginPath(); mx.arc(0,0,R*1.12,0,6.2832); mx.strokeStyle=hexA(col,0.18); mx.lineWidth=1; mx.stroke();
  } else {
    const n=Math.max(1,c.petals);
    const paB=lightBg?1.5:1;
    const pa=Math.max(0.08*paB,Math.min(lightBg?0.72:0.5,2.4*paB/n));   // brightness ~constant across petal counts
    mx.save(); mx.rotate(rot);
    for(let i=0;i<n;i++){ drawPetal((i/n)*6.2832, R, col, pa); }
    mx.restore();
    const n2=Math.min(n,12);
    mx.save(); mx.rotate(-rot*1.3);
    for(let i=0;i<n2;i++){ drawPetal((i/n2)*6.2832, R*0.62, col, Math.max(0.1,pa*0.7)); }
    mx.restore();
    mx.beginPath(); mx.arc(0,0,R*1.02,0,6.2832); mx.strokeStyle=hexA(col,0.16); mx.lineWidth=1; mx.stroke();
    drawYantraGeom(c, R, col);
  }

  // core orb
  const core=mx.createRadialGradient(0,0,0,0,0,R*0.42);
  core.addColorStop(0,lightBg?hexA(col,0.95):"rgba(255,255,255,0.95)");
  core.addColorStop(0.35,hexA(col,0.85));
  core.addColorStop(1,"rgba(0,0,0,0)");
  mx.beginPath(); mx.arc(0,0,R*0.42,0,6.2832); mx.fillStyle=core; mx.fill();

  // particles
  if(!reduce){
    if(Math.random()<0.4+energy) particles.push({a:Math.random()*6.2832,r:R*0.3,v:0.02+Math.random()*0.05,life:1});
    for(let i=particles.length-1;i>=0;i--){
      const p=particles[i]; p.r+=p.v*dt*0.5; p.life-=dt*0.0008;
      if(p.life<=0||p.r>R*2){ particles.splice(i,1); continue; }
      mx.beginPath(); mx.arc(Math.cos(p.a)*p.r,Math.sin(p.a)*p.r,1.4,0,6.2832);
      mx.fillStyle=hexA(col,0.5*p.life); mx.fill();
    }
  }
  mx.restore();

  // bija (source-over, crisp)
  mx.save(); mx.translate(cx,cy);
  mx.globalCompositeOperation="source-over";
  mx.textAlign="center"; mx.textBaseline="middle";
  mx.font='500 '+Math.round(baseR*0.42)+'px "Iowan Old Style", Palatino, Georgia, serif';
  mx.shadowColor=col; mx.shadowBlur=18;
  mx.fillStyle="rgba(255,255,255,0.96)";
  mx.fillText(c.bija, 0, baseR*0.02);
  mx.restore();
}
function yPath(rad, angsDeg, col, w, alpha){
  mx.beginPath();
  angsDeg.forEach((a,i)=>{ const r=a*Math.PI/180, x=Math.cos(r)*rad, y=Math.sin(r)*rad; if(i===0) mx.moveTo(x,y); else mx.lineTo(x,y); });
  mx.closePath(); mx.strokeStyle=hexA(col,alpha); mx.lineWidth=w; mx.stroke();
}
function yCircle(rad,col,w,alpha){ mx.beginPath(); mx.arc(0,0,rad,0,6.2832); mx.strokeStyle=hexA(col,alpha); mx.lineWidth=w; mx.stroke(); }
function drawYantraGeom(c,R,col){
  // traditional yantra core glyph per chakra (static line-art over the lotus)
  const r=R*0.5, w=1.4, a=0.52;
  switch(c.id){
    case "root":   yPath(r,[45,135,225,315],col,w,a); yPath(r*0.78,[90,210,330],col,w,a*0.8); break;  // square + downward triangle
    case "sacral": yCircle(r*0.92,col,w,a); yCircle(r*0.55,col,w,a*0.7); break;                        // moon circles
    case "solar":  yPath(r,[90,210,330],col,w,a); break;                                               // fire: downward triangle
    case "heart":  yPath(r,[90,210,330],col,w,a); yPath(r,[270,30,150],col,w,a); break;                // shatkona (hexagram)
    case "throat": yCircle(r*0.95,col,w,a*0.85); yPath(r*0.78,[90,210,330],col,w,a); break;            // circle + triangle
    case "third":  yPath(r,[90,210,330],col,w,a); break;                                               // downward triangle
    case "crown":  yPath(r*0.85,[270,30,150],col,w,a*0.7); break;                                      // subtle upward triangle
  }
}
function drawPetal(ang,R,col,alpha){
  mx.save(); mx.rotate(ang);
  const len=R*1.0, w=R*0.26;
  mx.beginPath();
  mx.moveTo(0,-R*0.2);
  mx.quadraticCurveTo(w,-len*0.55,0,-len);
  mx.quadraticCurveTo(-w,-len*0.55,0,-R*0.2);
  mx.closePath(); mx.fillStyle=hexA(col,alpha); mx.fill();
  mx.restore();
}
function drawStar(cx0,R,points,col,rotation,alpha){
  mx.save(); mx.rotate(rotation);
  mx.beginPath();
  for(let i=0;i<points*2;i++){
    const rr=i%2===0?R:R*0.42;
    const a=(i/(points*2))*6.2832-Math.PI/2;
    const x=Math.cos(a)*rr, y=Math.sin(a)*rr;
    if(i===0) mx.moveTo(x,y); else mx.lineTo(x,y);
  }
  mx.closePath();
  const g=mx.createRadialGradient(0,0,0,0,0,R);
  g.addColorStop(0,hexA(col,alpha)); g.addColorStop(1,hexA(col,alpha*0.15));
  mx.fillStyle=g; mx.fill();
  mx.restore();
}

let last=performance.now();
function loop(ts){
  const dt=Math.min(60,ts-last); last=ts;
  tickSession(ts);                 // keep timing accurate even when hidden
  const idle=(ts-lastAct>60000)&&!isPlaying&&!session.active&&breathKey==="off";
  if(!document.hidden && !idle){ tickBreath(ts); if(!reduce) drawBG(ts); if(visualMode==="sphere") drawSphere2D(ts); else drawMandala(ts,dt); }
  requestAnimationFrame(loop);
}

function renderPresets(){ const c=document.getElementById("presetChips"); if(!c) return; c.innerHTML=""; presets.forEach((p,idx)=>{ const chip=document.createElement("div"); chip.className="preset-chip"; const b=document.createElement("button"); b.type="button"; b.className="preset-load"; b.textContent=p.join("-"); b.addEventListener("click",()=>applyPreset(p)); const x=document.createElement("button"); x.type="button"; x.className="preset-del"; x.textContent="\u00d7"; x.setAttribute("aria-label","\u00d7"); x.addEventListener("click",ev=>{ ev.stopPropagation(); presets.splice(idx,1); savePresetsPref(); renderPresets(); }); chip.appendChild(b); chip.appendChild(x); c.appendChild(chip); }); }
function setLang(l){
  lang=l; document.documentElement.lang=l; document.documentElement.dir=(RTL.indexOf(l)>=0)?"rtl":"ltr"; document.title=T[l].titleDoc; savePref("lang",l);
  const sel=document.getElementById("langSel"); if(sel){ if(sel.value!==l) sel.value=l; sel.setAttribute("aria-label",T[l].langLabel); }
  document.querySelectorAll("[data-i18n]").forEach(el=>{ const k=el.getAttribute("data-i18n"); if(T[l][k]!=null) el.textContent=T[l][k]; });
  buildSelects(); buildDur(); buildKeys(); buildTutorial(); buildGateway(); buildCustom();
  buildThemeOptions(); renderHist();
  refreshInfo(); refreshColumn(); refreshPlayBtn(); refreshSessBtn();
  const c=CHAKRAS[current], mEl=document.getElementById("mandala");
  if(mEl) mEl.setAttribute("aria-label", cName(c)+" \u00b7 "+c.sk+" \u00b7 "+c.freq+" Hz");
  const hb=document.getElementById("breathHelp"); if(hb) hb.setAttribute("aria-label",T[l].breathGuide);
  const setTip=(id,txt)=>{ const e=document.getElementById(id); if(e&&txt){ e.title=txt; if(e.tagName!=="SELECT"&&e.tagName!=="INPUT") e.setAttribute("aria-label",txt); } };
  setTip("zenBtn",T[l].zenIn); setTip("zenExit",T[l].zenOut); setTip("gongBtn",T[l].gong); setTip("beginBtn",T[l].beginBtn); setTip("themeSel",T[l].themeL);
  setTip("gwBtn",T[l].gwTitle);
  setTip("vizBtn", visualMode==="sphere"?T[l].vizMandala:T[l].vizSphere);
  setTip("shareBtn",T[l].shareL); refreshMuteBtn(); refreshPauseBtn();
  refreshZenBtn();
}

/* events */
document.getElementById("langSel").addEventListener("change",e=>setLang(e.target.value));
document.getElementById("themeSel").addEventListener("change",e=>applyTheme(e.target.value));
document.getElementById("vizBtn").addEventListener("click",()=>{ visualMode=(visualMode==="sphere"?"mandala":"sphere"); applyVisual(); });
document.getElementById("muteBtn").addEventListener("click",()=>{ setMute(!muted); });
document.getElementById("shareBtn").addEventListener("click",e=>{ const btn=e.currentTarget, url=location.href; const done=()=>{ btn.classList.add("copied"); btn.setAttribute("aria-label",T[lang].linkCopied); btn.title=T[lang].linkCopied; clearTimeout(btn._ct); btn._ct=setTimeout(()=>{ btn.classList.remove("copied"); btn.setAttribute("aria-label",T[lang].shareL); btn.title=T[lang].shareL; },1600); }; const fb=()=>{ try{ const ta=document.createElement("textarea"); ta.value=url; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); }catch(_){} done(); }; if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(done,fb); } else fb(); });
document.getElementById("bellOn").addEventListener("change",e=>{ bellOn=e.target.checked; document.getElementById("bellSub").classList.toggle("on",bellOn); savePref("bell",bellOn?"1":"0"); });
document.getElementById("bellSel").addEventListener("change",e=>{ bellMin=Math.max(1,+e.target.value||5); savePref("bellMin",String(bellMin)); });
document.getElementById("simpleOn").addEventListener("change",e=>applySimple(e.target.checked));
document.getElementById("exportBtn").addEventListener("click",exportSettings);
document.getElementById("importBtn").addEventListener("click",()=>document.getElementById("importFile").click());
document.getElementById("importFile").addEventListener("change",e=>{ const f=e.target.files&&e.target.files[0]; if(f) importSettings(f); });
document.getElementById("resetBtn").addEventListener("click",e=>{ const b=e.currentTarget; if(b.dataset.armed!=="1"){ b.dataset.armed="1"; b.textContent=T[lang].resetSure; b.classList.add("copied"); clearTimeout(b._rt); b._rt=setTimeout(()=>{ b.dataset.armed="0"; b.textContent=T[lang].resetL; b.classList.remove("copied"); },3000); return; } try{ Object.keys(localStorage).filter(k=>k.indexOf("aurora.")===0).forEach(k=>localStorage.removeItem(k)); }catch(_){} try{ history.replaceState(null,"",location.pathname+location.search); }catch(_){} location.reload(); });
function expandPanel(p){ if(!p) return; p.classList.remove("collapsed"); const b=p.querySelector(".ph2btn"); if(b) b.setAttribute("aria-expanded","true"); }
(function(){
  const small = !!(window.matchMedia && window.matchMedia("(max-width:980px)").matches);
  document.querySelectorAll(".panel").forEach(p=>{
    if(small) p.classList.add("collapsed");
    const btn=p.querySelector(".ph2btn"); if(!btn) return;
    btn.setAttribute("aria-expanded", p.classList.contains("collapsed")?"false":"true");
    btn.addEventListener("click",()=>{ const c=p.classList.toggle("collapsed"); btn.setAttribute("aria-expanded", c?"false":"true"); });
  });
})();
document.getElementById("playBtn").addEventListener("click",()=>{ if(isPlaying){ pauseTone(); } else { playTone(); expandPanel(document.getElementById("playBtn").closest(".panel")); } });
document.getElementById("gongBtn").addEventListener("click",strikeGong);
document.getElementById("sessBtn").addEventListener("click",()=>{ if(session.active){ endSession(); } else { startSession(); expandPanel(document.getElementById("sessBtn").closest(".panel")); } });
document.getElementById("pauseBtn").addEventListener("click",()=>{ togglePause(); });
document.getElementById("binOn").addEventListener("change",e=>{
  binauralOn=e.target.checked; document.getElementById("binSub").classList.toggle("on",binauralOn); savePref("bin",binauralOn?"1":"0");
  if(isPlaying){ if(binauralOn) startBinaural(CHAKRAS[current].freq); else stopBinaural(); }
});
document.getElementById("beatSel").addEventListener("change",e=>{ beatHz=+e.target.value; savePref("beat",String(beatHz)); if(isPlaying&&binauralOn){stopBinaural();startBinaural(CHAKRAS[current].freq);} });
document.getElementById("jOn").addEventListener("change",e=>{ journeyOn=e.target.checked; document.getElementById("jSub").classList.toggle("on",journeyOn); savePref("journey",journeyOn?"1":"0"); });
document.getElementById("transOn").addEventListener("change",e=>{ includeTrans=e.target.checked; savePref("trans",includeTrans?"1":"0"); });
document.getElementById("jDownOn").addEventListener("change",e=>{ journeyDown=e.target.checked; savePref("jdir",journeyDown?"1":"0"); });
document.getElementById("breathSel").addEventListener("change",e=>setBreath(e.target.value));
document.getElementById("cueOn").addEventListener("change",e=>{ breathCues=e.target.checked; savePref("cue",breathCues?"1":"0"); if(breathCues){ ensureAudio(); resume(); } });
const reverbEl=document.getElementById("reverb");
reverbEl.addEventListener("input",e=>{ reverbAmt=+e.target.value/100; if(wetG) wetG.gain.setTargetAtTime(reverbAmt,actx.currentTime,0.05); e.target.style.setProperty("--p",e.target.value+"%"); savePref("reverb",e.target.value); });
const cueVolEl=document.getElementById("cueVol");
cueVolEl.addEventListener("input",e=>{ cueVol=+e.target.value/100; e.target.style.setProperty("--p",e.target.value+"%"); savePref("cuevol",e.target.value); });
const toneVolEl=document.getElementById("toneVolS");
toneVolEl.addEventListener("input",e=>{ toneVol=+e.target.value/100; if(toneVoice) toneVoice.gain.gain.setTargetAtTime(0.46*loudnessGain(CHAKRAS[current].freq)*toneVol,actx.currentTime,0.1); e.target.style.setProperty("--p",e.target.value+"%"); savePref("tonevol",e.target.value); });
const gongVolEl=document.getElementById("gongVolS");
gongVolEl.addEventListener("input",e=>{ gongVol=+e.target.value/100; e.target.style.setProperty("--p",e.target.value+"%"); savePref("gongvol",e.target.value); });
document.getElementById("affOn").addEventListener("change",e=>{ showAff=e.target.checked; savePref("aff",showAff?"1":"0"); refreshInfo(); });
document.getElementById("beginBtn").addEventListener("click",()=>{ if(isPlaying) return; if(breathKey==="off"){ setBreath("coherent"); const bs=document.getElementById("breathSel"); if(bs) bs.value="coherent"; } playTone(); expandPanel(document.getElementById("playBtn").closest(".panel")); });
let lastFocus=null;
const notice=document.getElementById("notice");
const obCard=document.getElementById("onboard");
let storageOK=true; try{ localStorage.setItem("aurora.__t","1"); localStorage.removeItem("aurora.__t"); }catch(e){ storageOK=false; }
if(loadPref("onboardSeen")!=="1"){ obCard.classList.remove("hidden"); notice.classList.add("hidden"); savePref("onboardSeen","1"); savePref("noticeSeen","1"); }
else if(loadPref("noticeSeen")==="1"){ notice.classList.add("hidden"); }
document.getElementById("obClose").addEventListener("click",()=>{ obCard.classList.add("hidden"); });
document.getElementById("noticeBtn").addEventListener("click",()=>{ notice.classList.add("hidden"); savePref("noticeSeen","1"); });
if(!storageOK){ const sw=document.getElementById("storeWarn"); if(sw) sw.hidden=false; }
["pointerdown","keydown","pointermove","wheel","touchstart"].forEach(ev=>window.addEventListener(ev,()=>{ lastAct=performance.now(); },{passive:true}));
(function(){
  let s=loadPref("reverb"); const rv=(s!==null&&!isNaN(+s))?Math.max(0,Math.min(100,+s)):38; reverbAmt=rv/100; reverbEl.value=rv; reverbEl.style.setProperty("--p",rv+"%");
  s=loadPref("cuevol"); const cv=(s!==null&&!isNaN(+s))?Math.max(0,Math.min(100,+s)):60; cueVol=cv/100; cueVolEl.value=cv; cueVolEl.style.setProperty("--p",cv+"%");
  s=loadPref("tonevol"); const tv=(s!==null&&!isNaN(+s))?Math.max(0,Math.min(100,+s)):100; toneVol=tv/100; toneVolEl.value=tv; toneVolEl.style.setProperty("--p",tv+"%");
  s=loadPref("gongvol"); const gv=(s!==null&&!isNaN(+s))?Math.max(0,Math.min(100,+s)):100; gongVol=gv/100; gongVolEl.value=gv; gongVolEl.style.setProperty("--p",gv+"%");
  s=loadPref("aff"); if(s!=null) showAff=(s==="1"); document.getElementById("affOn").checked=showAff;
})();
const vol=document.getElementById("vol");
vol.addEventListener("input",e=>{ const v=+e.target.value/100; setVolume(v); e.target.style.setProperty("--p",e.target.value+"%"); savePref("vol",e.target.value); });
(function(){ const s=loadPref("vol"); const val=(s!==null&&!isNaN(+s))?Math.max(0,Math.min(100,+s)):50; volume=val/100; vol.value=val; vol.style.setProperty("--p",val+"%"); })();

function openModal(s){ lastFocus=document.activeElement; s.classList.add("on"); const f=s.querySelector("button,a[href]"); if(f) f.focus(); }
function closeModal(s){ s.classList.remove("on"); if(lastFocus&&lastFocus.focus) lastFocus.focus(); updateHash(chakraHash()); }
let booting=true;
const bootHash=(location.hash||"").replace(/^#/,"").toLowerCase();
function chakraHash(){ return CHAKRAS[current] ? CHAKRAS[current].id : ""; }
function updateHash(h){ if(booting) return; try{ if((location.hash||"").replace(/^#/,"").toLowerCase()!==(h||"").toLowerCase()){ history.replaceState(null,"", h?("#"+h):(location.pathname+location.search)); } }catch(e){} }
function applyHashValue(h){
  h=(h||"").replace(/^#/,"").toLowerCase(); if(!h) return false;
  const ci=CHAKRAS.findIndex(c=>c.id===h);
  if(ci>=0){ const os=openScrim(); if(os) closeModal(os); applyChakra(ci,true); return true; }
  if(h==="about"){ openModal(document.getElementById("scrim")); return true; }
  if(h==="breathing"||h==="ghid"||h==="guide"){ buildTutorial(); openModal(tutScrim); return true; }
  if(h==="gateway"||h==="practici"){ buildGateway(); openModal(gwScrim); return true; }
  return false;
}
window.addEventListener("hashchange",()=>{ if(booting) return; applyHashValue(location.hash); });
function openScrim(){ return document.querySelector(".scrim.on"); }
document.querySelectorAll(".scrim").forEach(s=>{
  s.addEventListener("click",e=>{ if(e.target===s) closeModal(s); });
  s.addEventListener("keydown",e=>{
    if(e.key!=="Tab") return;
    const f=s.querySelectorAll("button,a[href]"); if(!f.length) return;
    const first=f[0], last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); }
  });
});
const tutScrim=document.getElementById("tutScrim");
const gwScrim=document.getElementById("gwScrim");
document.getElementById("aboutBtn").addEventListener("click",()=>{ openModal(document.getElementById("scrim")); updateHash("about"); });
document.getElementById("closeBtn").addEventListener("click",()=>closeModal(document.getElementById("scrim")));
document.getElementById("breathHelp").addEventListener("click",()=>{ buildTutorial(); openModal(tutScrim); updateHash("breathing"); });
document.getElementById("tutClose").addEventListener("click",()=>closeModal(tutScrim));
document.getElementById("gwBtn").addEventListener("click",()=>{ buildGateway(); openModal(gwScrim); updateHash("gateway"); });
document.getElementById("gwClose").addEventListener("click",()=>closeModal(gwScrim));

document.addEventListener("keydown",e=>{
  const op=openScrim();
  if(op){ if(e.key==="Escape"){ e.preventDefault(); closeModal(op); } return; }
  if(document.body.classList.contains("zen") && e.key==="Escape"){ e.preventDefault(); exitZen(); return; }
  if(e.target.tagName==="SELECT"||e.target.tagName==="INPUT") return;
  if(e.code==="Space"){ e.preventDefault(); isPlaying?pauseTone():playTone(); }
  else if(e.key==="g"||e.key==="G") strikeGong();
  else if(e.key==="ArrowUp"){ e.preventDefault(); applyChakra(current-1,true); }
  else if(e.key==="ArrowDown"){ e.preventDefault(); applyChakra(current+1,true); }
  else if(e.key==="b"||e.key==="B"){ const keys=Object.keys(PATTERNS); const ni=(keys.indexOf(breathKey)+1)%keys.length; setBreath(keys[ni]); document.getElementById("breathSel").value=keys[ni]; }
  else if(e.key==="l"||e.key==="L"){ const i=LANGS.findIndex(x=>x.code===lang); setLang(LANGS[(i+1)%LANGS.length].code); }
  else if(e.key==="+"||e.key==="="){ e.preventDefault(); adjustVol(0.05); }
  else if(e.key==="-"||e.key==="_"){ e.preventDefault(); adjustVol(-0.05); }
  else if(e.key==="?"){ e.preventDefault(); buildTutorial(); openModal(tutScrim); updateHash("breathing"); }
});

let rzT=null;
window.addEventListener("resize",()=>{ if(rzT) clearTimeout(rzT); rzT=setTimeout(()=>{ rzT=null; sizeAll(); },150); });

/* Focus / fullscreen mode */
function fsEl(){ return document.fullscreenElement||document.webkitFullscreenElement||null; }
function reqFs(){ const el=document.documentElement, r=el.requestFullscreen||el.webkitRequestFullscreen; if(r){ try{ const p=r.call(el); if(p&&p.catch) p.catch(()=>{}); }catch(e){} } }
function exitFs(){ if(fsEl()){ const x=document.exitFullscreen||document.webkitExitFullscreen; if(x){ try{ x.call(document); }catch(e){} } } }
function refreshZenBtn(){ const on=document.body.classList.contains("zen"); const b=document.getElementById("zenBtn"); if(b) b.setAttribute("aria-label", on?T[lang].zenOut:T[lang].zenIn); }
function enterZen(){ document.body.classList.add("zen"); reqFs(); refreshZenBtn(); setTimeout(sizeAll,60); }
function exitZen(){ document.body.classList.remove("zen"); exitFs(); refreshZenBtn(); setTimeout(sizeAll,60); }
function toggleZen(){ document.body.classList.contains("zen")?exitZen():enterZen(); }
document.getElementById("zenBtn").addEventListener("click",toggleZen);
document.getElementById("zenExit").addEventListener("click",exitZen);
function onFsChange(){ if(!fsEl()) document.body.classList.remove("zen"); refreshZenBtn(); requestAnimationFrame(sizeAll); setTimeout(sizeAll,80); }
document.addEventListener("fullscreenchange",onFsChange);
document.addEventListener("webkitfullscreenchange",onFsChange);

/* Screen wake lock during sessions */
let wakeLock=null;
async function acquireWake(){ try{ if(("wakeLock" in navigator) && document.visibilityState==="visible" && !wakeLock){ wakeLock=await navigator.wakeLock.request("screen"); setWakeInd(true); wakeLock.addEventListener("release",()=>{ wakeLock=null; setWakeInd(false); }); } }catch(e){ wakeLock=null; setWakeInd(false); } }
function releaseWake(){ try{ const w=wakeLock; wakeLock=null; setWakeInd(false); if(w) w.release(); }catch(e){} }

/* Resume audio + re-acquire wake lock when returning to the page (mobile suspends both) */
document.addEventListener("visibilitychange",()=>{
  if(document.hidden) return;
  if(actx && actx.state==="suspended" && (isPlaying||session.active)){ try{ actx.resume(); }catch(e){} }
  if(session.active && !wakeLock) acquireWake();
});

/* Restore persisted state */
function restoreState(){
  let v;
  v=loadPref("bin"); if(v!=null) binauralOn=(v==="1");
  v=loadPref("beat"); if(v!=null&&!isNaN(+v)) beatHz=+v;
  v=loadPref("breath"); if(v&&Object.prototype.hasOwnProperty.call(PATTERNS,v)) breathKey=v;
  v=loadPref("journey"); if(v!=null) journeyOn=(v==="1");
  v=loadPref("trans"); if(v!=null) includeTrans=(v==="1");
  v=loadPref("dur"); if(v!=null&&[5,10,15,20,30,45].indexOf(+v)>=0) durMin=+v;
  v=loadPref("custom"); if(v){ const a=v.split(",").map(x=>parseInt(x,10)); if(a.length===4&&a.every(n=>!isNaN(n))){ for(let i=0;i<4;i++){ const lo=(i===0||i===2)?1:0; customPat[i]=Math.max(lo,Math.min(20,a[i])); } } }
  v=loadPref("cue"); if(v!=null) breathCues=(v==="1");
  v=loadPref("chakra"); if(v!=null&&!isNaN(+v)) current=(((+v)%CHAKRAS.length)+CHAKRAS.length)%CHAKRAS.length;
  document.getElementById("binOn").checked=binauralOn; document.getElementById("binSub").classList.toggle("on",binauralOn);
  document.getElementById("jOn").checked=journeyOn; document.getElementById("jSub").classList.toggle("on",journeyOn);
  document.getElementById("transOn").checked=includeTrans;
  v=loadPref("jdir"); journeyDown=(v==="1"); document.getElementById("jDownOn").checked=journeyDown;
  document.getElementById("cueOn").checked=breathCues;
  loadHist(); loadPresets();
  v=loadPref("theme"); applyTheme(v||"cosmic");
  v=loadPref("simple"); applySimple(v==="1"); document.getElementById("simpleOn").checked=simpleMode;
  v=loadPref("viz"); if(v==="sphere"||v==="mandala") visualMode=v;
  v=loadPref("muted"); muted=(v==="1");
  v=loadPref("bell"); bellOn=(v==="1"); document.getElementById("bellOn").checked=bellOn; document.getElementById("bellSub").classList.toggle("on",bellOn);
  v=loadPref("bellMin"); if(v!=null&&!isNaN(+v)) bellMin=Math.max(1,+v);
}

/* init */
buildColumn();
buildLangOptions();
restoreState();
setLang(lang);
applyChakra(current,false);
setBreath(breathKey);
sizeAll();
applyVisual();
booting=false;
if(bootHash){ if(!applyHashValue(bootHash)) updateHash(chakraHash()); } else { updateHash(chakraHash()); }
requestAnimationFrame(loop);
</script>
